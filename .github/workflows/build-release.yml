name: ChatFLOW 2.1.8 three-platform release
on:
  workflow_dispatch:
    inputs:
      verify_run:
        description: Existing build run to verify installation and customer data
        required: false
        default: ''
permissions:
  contents: read
jobs:
  windows:
    if: ${{ inputs.verify_run == '' }}
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2
      - name: Prepare complete Git runtime including HTTPS and licenses
        shell: pwsh
        run: |
          $gitExe = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitExe)
          if (!(Test-Path "$gitRoot/cmd/git.exe") -or !(Test-Path "$gitRoot/mingw64/libexec/git-core/git-remote-https.exe")) { throw 'Incomplete Git distribution' }
          Copy-Item $gitRoot PortableGit -Recurse
      - name: Test application source
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: python -m PyInstaller chatflow.spec --noconfirm
      - name: Frozen generation and TLS
        run: python scripts/smoke_bundle.py
      - name: Frozen publishing with system Git removed from PATH
        run: python scripts/smoke_deploy.py
      - name: Actual independent window
        run: python scripts/smoke_window.py
      - name: Saved login across actual close and reopen
        run: python scripts/smoke_login.py
      - name: Local AI actual model
        timeout-minutes: 20
        run: python scripts/smoke_local_ai.py
      - name: Build installer
        shell: pwsh
        run: |
          Copy-Item RELEASE_GUIDE.md dist/ChatFLOW/
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Verify installation preserves customer profile
        run: python scripts/smoke_install.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-diagnostics
          path: dist/login-diagnostic-*.png
          if-no-files-found: ignore
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/*Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFLOW-Windows-x64-v2.1.8
          path: |
            dist/*Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  macos:
    if: ${{ inputs.verify_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            label: Intel
          - runner: macos-15
            architecture: arm64
            label: AppleSilicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CF_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm CPU architecture
        run: test "$(uname -m)" = "$CF_ARCH"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2
      - name: Test application source
        run: python -m unittest discover -s tests -v
      - name: Build native Mac application
        run: python -m PyInstaller chatflow.spec --noconfirm
      - name: Check signature and executable architecture
        run: |
          codesign --verify --deep --strict dist/ChatFLOW.app
          file dist/ChatFLOW.app/Contents/MacOS/ChatFLOW | grep "$CF_ARCH"
      - name: Frozen generation and TLS
        run: python scripts/smoke_bundle.py
      - name: Actual independent window
        run: python scripts/smoke_window.py
      - name: Saved login across actual close and reopen
        run: python scripts/smoke_login.py
      - name: Local AI actual model
        timeout-minutes: 20
        run: python scripts/smoke_local_ai.py
      - name: Build and mount installer image
        run: |
          mkdir -p dist/mac-installer
          cp -R dist/ChatFLOW.app dist/mac-installer/
          ln -s /Applications dist/mac-installer/Applications
          cp RELEASE_GUIDE.md dist/mac-installer/使用说明.md
          if [ "${{ matrix.label }}" = Intel ]; then
            cp packaging/Intel-恢复独立窗口.command dist/mac-installer/
            chmod +x dist/mac-installer/Intel-恢复独立窗口.command
          fi
          hdiutil create -volname "ChatFLOW 2.1.8 ${{ matrix.label }}" -srcfolder dist/mac-installer -format UDZO -ov "dist/ChatFLOW-macOS-${{ matrix.label }}-v2.1.8.dmg"
          hdiutil verify "dist/ChatFLOW-macOS-${{ matrix.label }}-v2.1.8.dmg"
          mkdir -p dist/mounted
          hdiutil attach -nobrowse -readonly -mountpoint dist/mounted "dist/ChatFLOW-macOS-${{ matrix.label }}-v2.1.8.dmg"
          test -x dist/mounted/ChatFLOW.app/Contents/MacOS/ChatFLOW
          codesign --verify --deep --strict dist/mounted/ChatFLOW.app
          hdiutil detach dist/mounted
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 "ChatFLOW-macOS-${{ matrix.label }}-v2.1.8.dmg" > "SHA256SUMS-${{ matrix.label }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFLOW-macOS-${{ matrix.label }}-v2.1.8
          path: |
            dist/ChatFLOW-macOS-${{ matrix.label }}-v2.1.8.dmg
            dist/SHA256SUMS-${{ matrix.label }}.txt
          if-no-files-found: error

  verify-upgrade:
    if: ${{ inputs.verify_run != '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: ChatFLOW-Windows-x64-v2.1.8
          run-id: ${{ inputs.verify_run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Verify upgrade preserves customer data
        shell: pwsh
        run: |
          python scripts/smoke_install.py 2>&1 | Tee-Object -FilePath upgrade-verification.txt
          if ($LASTEXITCODE -ne 0) { throw 'Upgrade preservation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-upgrade-verification
          path: upgrade-verification.txt
