name: Windows repair 2.1.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.2
      - name: Prepare complete Git runtime including HTTPS and licenses
        shell: pwsh
        run: |
          $gitExe = (Get-Command git.exe).Source
          $gitRoot = Split-Path (Split-Path $gitExe)
          if (!(Test-Path "$gitRoot/cmd/git.exe") -or !(Test-Path "$gitRoot/mingw64/libexec/git-core/git-remote-https.exe")) { throw 'Incomplete Git distribution' }
          Copy-Item $gitRoot PortableGit -Recurse
      - name: Test application source
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: python -m PyInstaller chatflow.spec --noconfirm
      - name: Frozen generation and TLS
        run: python scripts/smoke_bundle.py
      - name: Frozen publishing with system Git removed from PATH
        run: python scripts/smoke_deploy.py
      - name: Actual independent window
        run: python scripts/smoke_window.py
      - name: Saved login across actual close and reopen
        run: python scripts/smoke_login.py
      - name: Local AI actual model
        timeout-minutes: 20
        run: python scripts/smoke_local_ai.py
      - name: Build installer
        shell: pwsh
        run: |
          Copy-Item RELEASE_GUIDE.md dist/ChatFLOW/
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install twice and verify installed application
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP/ChatFLOW Installed"
          1..2 | ForEach-Object {
            $process = Start-Process dist/ChatFLOW-Windows-x64-v2.1.6-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$target`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          }
          $env:CF_DATA_DIR = "$env:RUNNER_TEMP/ChatFLOW Upgrade Data"
          New-Item -ItemType Directory -Force $env:CF_DATA_DIR | Out-Null
          $env:PATH = "$env:SystemRoot/System32"
          $process = Start-Process "$target/ChatFLOW.exe" -ArgumentList '--self-test-deploy' -Wait -PassThru
          $report = Get-Content "$env:CF_DATA_DIR/self-test-deploy.json" -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or !$report.ok) { throw ($report | ConvertTo-Json) }
      - name: Verify remembered login in installed application
        shell: pwsh
        run: |
          $env:CF_TEST_BINARY = "$env:RUNNER_TEMP/ChatFLOW Installed/ChatFLOW.exe"
          python scripts/smoke_login.py
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/*Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFLOW-Windows-x64-v2.1.6
          path: |
            dist/*Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
